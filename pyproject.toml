[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smooth-operator"
version = "0.1.0"
description = "Planar two-joint manipulation experiments in PyBullet"
requires-python = ">=3.9"
dependencies = ["pybullet==3.2.7", "numpy==1.26.4", "Pillow==11.3.0"]

[project.scripts]
smooth-operator = "smooth_operator.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
