<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>2 · What is a VLA?</title>
<link rel="stylesheet" href="assets/deck.css">
</head>
<body>
<div id="deck">
  <section class="slide">
    <svg viewBox="0 0 1280 720">
      <defs>
        <clipPath id="camclip"><rect x="80" y="215" width="300" height="190" rx="16"/></clipPath>
        <clipPath id="robclip"><rect x="890" y="215" width="330" height="330" rx="20"/></clipPath>
      </defs>
      <text x="80" y="78" class="h1">What is a VLA?</text>
      <text x="80" y="114" class="h2">A Vision-Language-Action model: one network that turns what it sees and what it is told into how to move.</text>

      <text x="80" y="203" style="font-size:15px;font-weight:500;fill:#5F6368">Camera image</text>
      <rect x="80" y="215" width="300" height="190" rx="16" fill="#fff" stroke="#DADCE0" stroke-width="1.5"/>
      <g clip-path="url(#camclip)" id="cam"></g>
      <g stroke="#5F6368" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M96,245 v-14 h14"/><path d="M364,245 v-14 h-14"/>
        <path d="M96,375 v14 h14"/><path d="M364,375 v14 h-14"/>
      </g>
      <circle cx="122" cy="246" r="5" fill="#EA4335"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="132" y="251" style="font-size:12px;font-weight:500;fill:#5F6368">LIVE</text>

      <text x="80" y="433" style="font-size:15px;font-weight:500;fill:#5F6368">Language instruction</text>
      <path d="M102,445 h256 a22,22 0 0 1 22,22 v56 a22,22 0 0 1 -22,22 h-220 l-26,22 v-22 h-10 a22,22 0 0 1 -22,-22 v-56 a22,22 0 0 1 22,-22 z" fill="#FEF7E0"/>
      <text x="104" y="486" style="font-size:19px">“Pick up the soup can and</text>
      <text x="104" y="514" style="font-size:19px">place it in the basket.”</text>

      <path d="M385,310 C440,310 445,345 492,345" fill="none" stroke="#5F6368" stroke-width="2.5" class="flow" marker-end="url(#ah-gray)"/>
      <path d="M385,494 C440,494 445,455 492,455" fill="none" stroke="#5F6368" stroke-width="2.5" class="flow" marker-end="url(#ah-gray)"/>

      <rect x="500" y="215" width="300" height="330" rx="24" fill="#fff" filter="url(#sh)"/>
      <text x="650" y="290" text-anchor="middle" style="font-size:58px;font-weight:700;letter-spacing:2px">
        <tspan fill="#4285F4">V</tspan><tspan fill="#EA4335">L</tspan><tspan fill="#34A853">A</tspan></text>
      <rect x="530" y="318" width="240" height="50" rx="25" fill="#E8F0FE"/>
      <text x="650" y="349" text-anchor="middle" style="font-size:18px;font-weight:500;fill:#1967D2">Vision encoder</text>
      <rect x="530" y="384" width="240" height="50" rx="25" fill="#FCE8E6"/>
      <text x="650" y="415" text-anchor="middle" style="font-size:18px;font-weight:500;fill:#C5221F">Language model</text>
      <rect x="530" y="450" width="240" height="50" rx="25" fill="#E6F4EA"/>
      <text x="650" y="481" text-anchor="middle" style="font-size:18px;font-weight:500;fill:#137333">Action decoder</text>
      <text x="650" y="578" text-anchor="middle" style="font-size:15px;fill:#5F6368">e.g. π₀-FAST · PaliGemma 3B backbone</text>

      <path d="M805,380 L880,380" fill="none" stroke="#5F6368" stroke-width="2.5" class="flow" marker-end="url(#ah-gray)"/>
      <text x="843" y="366" text-anchor="middle" style="font-size:14px;font-weight:500;fill:#5F6368">actions</text>

      <text x="890" y="203" style="font-size:15px;font-weight:500;fill:#5F6368">Robot executes</text>
      <rect x="890" y="215" width="330" height="330" rx="20" fill="#fff" stroke="#DADCE0" stroke-width="1.5"/>
      <g clip-path="url(#robclip)" id="rob"></g>

      <path d="M1055,550 L1055,615 Q1055,640 1030,640 L75,640 Q50,640 50,615 L50,335 Q50,310 75,310 L76,310"
            fill="none" stroke="#BDC1C6" stroke-width="2.5" class="flow" marker-end="url(#ah-gray)"/>
      <rect x="445" y="628" width="410" height="24" fill="#fff"/>
      <text x="650" y="646" text-anchor="middle" style="font-size:15px;fill:#5F6368">observe the new scene → predict the next actions → repeat</text>
      <text x="80" y="695" class="foot">Smooth Operator</text>
    </svg>
  </section>
</div>

<script src="assets/arm.js"></script>
<script src="assets/deck.js"></script>
<script>
const armCam = makeArm(document.getElementById('cam'), { x: 160, y: 352, s: 0.62, table: [-200, 400] });
const armRob = makeArm(document.getElementById('rob'), { x: 1000, y: 445, s: 0.82, table: [-200, 400] });
startDeck({
  index: 2, total: 14,
  prev: '01_title.html',
  next: '03_joint_angles.html',
  frame: t => { const st = sceneState(t); armCam.update(st); armRob.update(st); },
});
</script>
</body>
</html>
